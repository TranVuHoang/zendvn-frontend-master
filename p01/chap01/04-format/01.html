<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Example 01</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .box {
        border: 2px solid red;
      }

      #boxed {
        width: 600px;
      }

      div {
        border: 1px solid #000;
        padding: 5px;
      }
    </style>
  </head>
  <body>
    <div class="box" id="boxed" style="width: 900px">Cấu trúc HTML tag</div>
  </body>
</html>
