<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Example 01</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .box {
        width: 250px;
        min-height: 300px;
        max-height: 1000px;
        border: 2px solid #000;
        margin: 20px 40px;
        padding: 5px;
        text-align: justify;
        margin: 29px auto;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <p>
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptatem
        fugiat beatae, qui dolores eum possimus cumque consequatur hic harum
        ullam amet ut corrupti. Delectus consectetur a alias maiores, similique
        commodi?
      </p>
    </div>
  </body>
</html>
