<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Example 02</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      #main {
        display: flex;
        color: white;
        text-align: center;
        align-items: center;
        justify-content: center;
      }

      .box {
        height: 200px;
      }

      .left {
        background: red;
        width: 200px;
      }

      .content {
        background: green;
        width: 500px;
      }

      .right {
        background: blue;
        width: 300px;
      }
    </style>
  </head>
  <body>
    <div id="main">
      <div class="box left">Left</div>
      <div class="box content">Content</div>
      <div class="box right">Right</div>
    </div>
  </body>
</html>
