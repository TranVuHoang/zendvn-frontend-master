<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Example 01</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .block {
        width: 500px;
        height: 300px;
        border: 3px solid #000;
        margin: 20px auto;
        padding: 10px;
      }

      .block-group {
        /* letter-spacing: 1px; */
        /* word-spacing: 10px; */
        text-align: justify;
        text-indent: 19px;
        white-space: normal;
        vertical-align: bottom;
        /* display: none; */
      }

      .block-group span {
        vertical-align: super;
      }
    </style>
  </head>
  <body>
    <div class="block block-group">
      <p>
        Lorem ipsum <sub>dolor</sub> sit amet consectetur adipisicing elit. Odio
        non, minima voluptatum dicta nulla <span>labore illum</span>
        <sup>quae</sup>
        blanditiis ea nisi rem at deserunt amet harum sed temporibus. Enim,
        rerum fugiat!
      </p>
    </div>
  </body>
</html>
