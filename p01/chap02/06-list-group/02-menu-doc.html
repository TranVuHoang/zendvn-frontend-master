<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Example 02</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .block {
        width: 500px;
        height: 250px;
        margin: 20px auto;
        border: 2px solid red;
      }

      .menu {
        list-style: none;
        width: 200px;
        margin: 20px;
      }

      .menu li {
        border: 1px solid #000;
        margin-bottom: 2px;
        padding: 3px;
      }

      .menu .active {
        background: #2b832b;
      }
    </style>
  </head>
  <body>
    <div class="block">
      <ul class="menu">
        <li>Home</li>
        <li class="active">About</li>
        <li>Products</li>
        <li>Specials</li>
        <li>Contact</li>
      </ul>
    </div>
  </body>
</html>
