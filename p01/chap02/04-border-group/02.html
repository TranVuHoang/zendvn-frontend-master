<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Example 01</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .block {
        width: 500px;
        height: 300px;
        border: 3px solid #000;
        margin: 20px auto;
        padding: 10px;
      }

      .box-border {
        border: 1px solid #000;
      }
    </style>
  </head>
  <body>
    <div class="block box-border">
      <p>
        Lorem ipsum <sub>dolor</sub> sit amet consectetur adipisicing elit. Odio
        non, minima voluptatum dicta nulla <span>labore illum</span>
        <sup>quae</sup>
        blanditiis ea nisi rem at deserunt amet harum sed temporibus. Enim,
        rerum fugiat!
      </p>
    </div>
  </body>
</html>
