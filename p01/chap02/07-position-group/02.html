<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Example 02</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .block {
        width: 600px;
        height: 800px;
        border: 2px solid #000;
        background: url("1.avif");
        margin: 20px auto;
        position: relative;
      }

      .box {
        width: 100%;
        height: 30px;
        border: 1px solid #000;
        background: yellow;
        text-align: center;
      }

      .header {
        position: fixed;
        top: 0;
      }

      .footer {
        position: fixed;
        bottom: 0;
      }
    </style>
  </head>
  <body>
    <div class="block"></div>
    <div class="box header">Header</div>
    <div class="box footer">Footer</div>
  </body>
</html>
