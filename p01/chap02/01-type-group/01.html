<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Example 01</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .block {
        width: 400px;
        height: 200px;
        border: 2px solid #000;
        padding: 5px;
      }

      .txt {
        font-family: "Tahoma", sans-serif;
        font-size: 18px;
        font-style: italic;
        font-variant: small-caps;
        font-weight: 600;
        line-height: 1.4;
        color: red;
      }
    </style>
  </head>
  <body>
    <div class="block txt">
      <p>
        "Lorem ipsum, dolor sit amet consectetur adipisicing elit. Adipisci id
        modi quibusdam dolorem, dolor dignissimos corrupti rem eveniet iure,
        praesentium incidunt, voluptas minus sapiente doloremque! Eligendi
        possimus dolores explicabo tenetur.
      </p>
    </div>
  </body>
</html>
